name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Help, syntax and offline integration tests
        shell: ${{ matrix.shell }}
        run: |
          & .\api.ps1 -Help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\Run-Tests.ps1
      - name: Whitespace validation
        shell: pwsh
        run: git diff --check
